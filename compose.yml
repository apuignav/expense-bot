services:
  expense-bot:
    build:
      context: .
    image: expense-bot:local
    container_name: expense-bot
    restart: unless-stopped
    init: true
    user: "${PUID:-10001}:${PGID:-10001}"
    environment:
      TZ: ${TZ:-Europe/Zurich}
    volumes:
      # Paths come from the project .env file (see .env.example).
      - ${EXPENSEBOT_CONFIG_FILE:?Set EXPENSEBOT_CONFIG_FILE in .env}:/config/expensebot.yaml:ro
      - ${EXPENSEBOT_DATA_DIR:?Set EXPENSEBOT_DATA_DIR in .env}:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
